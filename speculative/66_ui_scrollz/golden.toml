# `j3c golden speculative/66_ui_scrollz`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 027 chunk 7: a scrolling box is no stacking context. A z-index 10 child of a scroller is above a z-index 5 sibling of the
# scroller but still clipped by it and moved by its scroll offset; the second demo nests two scrollers, the third puts one in a
# rotated box (its shape clip is pushed again for the child).
#   rest      nothing scrolled
#   scrolled  one wheel notch over the first demo's child: the scroller and the child have moved up
[defaults]
frame = 45
[state.rest]
[state.scrolled]
[state.scrolled.env]
STACK_MODE = "scrolled"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
