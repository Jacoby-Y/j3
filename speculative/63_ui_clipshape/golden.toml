# `j3c golden speculative/63_ui_clipshape`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 027 chunk 1: a rotated or skewed `overflow` box clips to its real shape (corners do not leak), nested clips intersect
# (rotated inside rotated, rotated inside a plain clip), `overflow-x` alone on a rotated box cuts only the two turned side edges, and a sixth nested clip
# (cap is four turned clips) falls back to its bounding box with a stderr warning.
# Each cell holds the same oversized child (a frame with a cross) in a 90x56 box.
[defaults]
frame = 4
[state.clipshape]
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
