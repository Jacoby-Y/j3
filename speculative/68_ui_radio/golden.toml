# `j3c golden speculative/68_ui_radio`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 027 chunk 9: radio inputs. Left: default radios (Medium checked, Huge disabled); middle: styled (accent-color, round background, :checked label,
# disabled dimmed); right: an int group (same name "size" as the left one, but in its own role=radiogroup scope, so independent).
#   rest    nothing focused
#   keys    Tab then Down: focus moved to Large and checked, blue focus ring
#   styled  Tab, Tab, Down: Rose checked in the styled group (its disabled Sky is skipped), red ring
[defaults]
frame = 45
[state.rest]
[state.keys]
[state.keys.env]
RADIO_MODE = "keys"
[state.styled]
[state.styled.env]
RADIO_MODE = "styled"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
