# `j3c golden speculative/44_ui_themevars`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 11 of plan 026: `var()` inside compound values (gradient stops, box-shadow and border colors, `color-mix()`),
# restyled once when the scheme flips (`@media (prefers-color-scheme)` swaps `--accent` / `--surface` on `:root`).
#   light  default scheme    dark  dark scheme (set at frame 2)
[defaults]
frame = 8
[state.light]
[state.dark]
[state.dark.env]
THEME_MODE = "dark"
