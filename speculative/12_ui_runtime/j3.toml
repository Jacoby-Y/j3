# Stage 05 of plan 022: the hand-desugared target of the .j3ui compiler (see README.md).
# From the repo root, headless:  j3c build speculative/12_ui_runtime
#   cd speculative/12_ui_runtime && SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy timeout 10 target/idle test

[package]
name = "idle"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 0

[link]
libs = ["SDL2", "SDL2_ttf", "SDL2_image"]

[ui]
dir = "ui"
theme = "ui/theme.css"
