# `j3c golden speculative/58_ui_actions`. Needs DejaVu Sans.
# Chunk 29 of plan 026: `bind:this` and `use:`. Screen counts its own frames (onFrame):
#   frame 10  param 1 -> 2: `measure_update` runs once
#   frame 20  the panel's {#if} closes: `measure_destroy` runs, its handle goes stale
#   frame 30  the panel opens again (a new element, maybe the old id): `measure` runs again, the stale handle stays dead
#   early  frame 6: input focused through bind:this in onMount, panel measured once
#   late   frame 40 (the counter stops at 50, so frames 60+ are idle): m2 u1 d1, stale handle rejected, rows hold three distinct handles
[defaults]
frame = 6
[state.early]
[state.late]
frame = 40
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
