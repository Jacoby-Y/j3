# `j3c golden speculative/40_ui_grid`. No text, so no font is needed.
# Chunk 6 of plan 026: `repeat(auto-fill, minmax(48px, 1fr))` inventory, `grid-auto-rows`, `grid-template-rows` with
# `minmax`, `grid-column: 1 / -1`, `span`, an explicit `grid-row`.
#   wide     420 px window: the inventory has 7 columns, the dashboard columns widen
#   narrow   320 px window (the smallest): 5 inventory columns, more rows
[defaults]
frame = 6
[state.wide]
[state.narrow]
[state.narrow.env]
GRID_MODE = "narrow"
