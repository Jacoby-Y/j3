# `j3c golden speculative/60_ui_valign`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 34 of plan 026: `vertical-align` on inline boxes, text and inline-blocks. Rows: keywords (baseline super sub middle),
# small text (text-top text-bottom middle), top/bottom against a tall line, lengths and a percentage, a wrapped raised span,
# inline-block squares. Pills are decorated spans, so the box follows its raised text.
[defaults]
frame = 4
[state.align]
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
