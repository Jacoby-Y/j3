# `j3c golden speculative/52_ui_labels`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 20 of plan 026: <label> activates its control.
#   rest    three labels unchecked
#   click   frames 5-7 click the wrapped label's text, 13-15 the `for` label's text: a and b are true
[defaults]
frame = 25
[state.rest]
[state.click]
[state.click.env]
SEL_PTR = "click"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
