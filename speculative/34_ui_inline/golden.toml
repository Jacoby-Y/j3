# `j3c golden speculative/34_ui_inline`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 023 15f: inline boxes: tag pills, a span highlighted across lines, nested spans, ::before pills.
[defaults]
frame = 4
[state.boxes]
# sel (plan 023 12c): a double click on "Mira" (text inside a pill with its own background) selects the word; the highlight paints over the pill.
[state.sel]
frame = 14
[state.sel.env]
INLINE_SEL = "1"
