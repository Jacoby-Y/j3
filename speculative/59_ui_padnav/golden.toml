# `j3c golden speculative/59_ui_padnav`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 023 stage 16: a settings menu driven only by simulated pad input (`testkit.padPress`); the focus ring shows.
#   none   nothing pressed: no focus, no ring
#   walk   frame 24: Down (music box), A (on), Down (slider), Right twice (slider 0.7), Down: the quality select has the ring
#   pick   frame 40: A opens the quality list, Down twice, A chooses: Quality High, ring on the select
#   end    frame 50: Down (Back), Right wraps within the button row to Apply, A: applied 1; Right (Back), A: back 1
#   summary frame 30: Down x5 reaches the bare <summary> (generated tabindex), A opens the details
#   tab    frame 30: Tab x6 and Enter do the same by keyboard
#   mouse  frame 30: after the walk the mouse moves: the ring is gone, the state stays
[defaults]
frame = 24
[state.none]
[state.none.env]
PADNAV_MODE = "none"
[state.walk]
[state.walk.env]
PADNAV_MODE = "walk"
[state.pick]
frame = 40
[state.pick.env]
PADNAV_MODE = "pick"
[state.end]
frame = 50
[state.end.env]
PADNAV_MODE = "end"
[state.mouse]
frame = 30
[state.mouse.env]
PADNAV_MODE = "mouse"
[state.summary]
frame = 30
[state.summary.env]
PADNAV_MODE = "summary"
[state.tab]
frame = 30
[state.tab.env]
PADNAV_MODE = "tab"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
