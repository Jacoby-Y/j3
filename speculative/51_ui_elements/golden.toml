# `j3c golden speculative/51_ui_elements`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 19 of plan 026: <br>, <progress>, <meter>, <details>/<summary>.
#   rest    br text, a progress at 40%, a meter in its three regions, one details open and one closed
#   click   frame 5-8: the closed details' summary is clicked and opens
[defaults]
frame = 20
[state.rest]
[state.click]
[state.click.env]
SEL_PTR = "click"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
