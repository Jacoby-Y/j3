# `j3c golden speculative/50_ui_has`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 17 of plan 026: limited `:has()`: `.task:has(input:checked)` (the whole row highlights), `.card:has(> img)` (a card with a picture
# gets a frame and a wider title), `.menu:has(:hover)`-style states are covered in stdlib/tests/has_test.
#   rest    the first task is checked, its row is green; the second card has an image and a frame
#   click   frame 5-8: the second checkbox is clicked, its row highlights too
[defaults]
frame = 20
[state.rest]
[state.click]
[state.click.env]
SEL_PTR = "click"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
