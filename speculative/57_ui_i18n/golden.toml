# `j3c golden speculative/57_ui_i18n`. Needs DejaVu Sans (Latin, Cyrillic and Arabic glyphs) and HarfBuzz in SDL_ttf.
# Chunk 28 of plan 026: j3.i18n. The same screen per locale, picked by the LOCALE env var in src/main.j3.
#   en   English: title, plural "1 item / 3 items", grouped number, button
#   de   German strings, "1.234.567" number
#   ar   Arabic strings through the shaping path, mirrored layout (i18n.rtl() adds the `rtl` class)
[defaults]
frame = 6
[state.en]
[state.en.env]
LOCALE = "en"
[state.de]
[state.de.env]
LOCALE = "de"
[state.ar]
[state.ar.env]
LOCALE = "ar"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
LOCALE = "ar"
