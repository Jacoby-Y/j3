# `j3c golden speculative/69_ui_glyph`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 027 chunk 10: `<glyph>` prompts. Lines: action prompts, shoulders/scroll, game actions with key= and pad=, and two big lines where the glyph is
# vertical-align: middle in text (the second restyled through glyph[type=key] / glyph[type=pad]).
#   rest  keyboard keycaps (Enter, Esc, Shift+Tab, Tab, Wheel, Space, F)
#   pad   after a pad press: xbox labels (A, B, LB, RB, RS, Y, RT) in round pills
#   psplain  ps in Open Sans (no symbols): Cross, Circle, Square, Triangle (needs Open Sans)
#   ps    the same with setGlyphStyle("playstation") (cross, circle, L1, R1, R2)
[defaults]
frame = 45
[state.rest]
[state.pad]
[state.pad.env]
GLYPH_MODE = "pad"
[state.ps]
[state.ps.env]
GLYPH_MODE = "ps"
[state.psplain]
[state.psplain.env]
GLYPH_MODE = "psplain"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
