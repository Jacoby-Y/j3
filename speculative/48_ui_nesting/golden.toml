# `j3c golden speculative/48_ui_nesting`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 15 of plan 026: CSS nesting in a component <style> (`&:hover`, `.title`, `& + &`, `.btn { &:active }`, `.screen &`, a nested
# `@media (max-width)`, a declaration after the nested rules) and in theme.css (`.page { .hint { &:hover } }`).
#   rest     480 px wide, pointer away
#   hover    the first card hovered: bluish background, pink title
#   active   the first card's button pressed: darker button
#   narrow   320 px wide: the nested @media narrows the cards and tints them
[defaults]
frame = 20
[state.rest]
[state.hover]
[state.hover.env]
NEST_PTR = "hover"
[state.active]
[state.active.env]
NEST_PTR = "active"
[state.narrow]
[state.narrow.env]
NEST_NARROW = "1"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
