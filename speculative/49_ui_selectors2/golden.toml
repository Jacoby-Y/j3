# `j3c golden speculative/49_ui_selectors2`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 16 of plan 026: `:checked` (`input:checked + label`), `:nth-of-type(even)` / `:last-of-type` among mixed tags, `:empty`
# (with a `::before` placeholder), `:placeholder-shown`, `:enabled`.
#   rest    the first task is checked (struck through), the zebra table, one empty notes box, the empty text box tinted
#   click   frame 5-8: the second checkbox is clicked, its label is struck through too
[defaults]
frame = 20
[state.rest]
[state.click]
[state.click.env]
SEL_PTR = "click"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
