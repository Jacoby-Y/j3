# `j3c golden speculative/64_ui_bidi`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 027 chunk 2: numbers inside right-to-left text. Each row is a latin label and an RTL string whose numeric
# punctuation used to land on the wrong side. Expected (UAX #9 W2-W7, N1/N2): "12", "10:30", "3,5", "1.000,50", "1/2",
# "$20" (Hebrew) read left to right as written; "50%" and "-5" keep the sign on the side the reading order puts it.
# Orders are asserted in j3c/stdlib/tests/bidi_test.j3.
[defaults]
frame = 4
[state.bidi]
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
