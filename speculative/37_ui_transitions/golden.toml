# `j3c golden speculative/37_ui_transitions`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Five boxes appear on frame 6 and leave on frame 30, each effect 200 ms linear (16 ms frames):
# fade, fly in from the right, slide (height), scale from 0.2, in:fly out:fade.
#   before   nothing shown
#   enter    frame 12: about half way in
#   shown    frame 24: settled
#   leave    frame 36: about half way out
[defaults]
frame = 4
[state.before]
[state.enter]
frame = 12
[state.shown]
frame = 24
[state.leave]
frame = 36
