# `j3c golden speculative/61_ui_boxbreak`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 35 of plan 026: `box-decoration-break`. Left column slice (the default), right column clone, on the same wrapped spans:
# plain padding+border, rounded corners with a gradient background, and a box-shadow. Clone repeats every edge on every line piece.
[defaults]
frame = 4
[state.break]
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
