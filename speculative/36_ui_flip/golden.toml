# `j3c golden speculative/36_ui_flip`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# animate:flip on keyed rows; the list is reversed on frame 6 (300 ms linear glide, 16 ms frames).
#   before   Apple..Eggs in order
#   mid      frame 12: rows partway between old and new places
#   end      frame 30: reversed, all settled
[defaults]
frame = 4
[state.before]
[state.mid]
frame = 12
[state.end]
frame = 30
