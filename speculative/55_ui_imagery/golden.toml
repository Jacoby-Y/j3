# `j3c golden speculative/55_ui_imagery`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 24 of plan 026: image-heavy CSS. Assets are tiny PNGs written by tools/make_assets.py.
#   rest    a pixel-art nine-slice frame (24 px, slice 8, drawn 16 px wide, image-rendering: pixelated) with repeat, round, space and
#           stretch edges at 150 x 90 and 109 x 70 (repeat centers and cuts the end tiles, round rescales them to fit, space spreads gaps,
#           space hides the edge when one tile does not fit); a % slice with border-image-outset; a box with three background layers
#           (png, gradient, png; first on top); a box whose size, position and repeat lists cycle over two layers
[defaults]
frame = 60
[state.rest]
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
