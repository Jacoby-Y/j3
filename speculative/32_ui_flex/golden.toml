# `j3c golden speculative/32_ui_flex`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 023 15d text probe in the lower half (TextCSS component): white-space pre / pre-wrap, justify, line-clamp, visibility.
#   before  toggle off: pre keeps the run of spaces, line-clamp 1
#   after   toggle on (frame 20): first block is pre-wrap, line-clamp 2 with an ellipsis, hidden box shown
[defaults]
frame = 4
[state.before]
[state.after]
frame = 20
