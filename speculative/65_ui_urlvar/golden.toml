# `j3c golden speculative/65_ui_urlvar`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Plan 027 chunk 6: `url()` held by custom properties declared in theme.css (`--box`, `--tile`) and used by the component:
# border-image shorthand and source, a layer list with a gradient and a `var(--x, url())` fallback, a lone var with a fallback
# chain, a missing var falling back to a url, and the `background` shorthand. The dark state swaps `--tile` (dots to stripes)
# after flipping the scheme every frame for 18 frames; main.j3 panics if a texture loads after frame 40 or a steady frame
# restyles, lays out or allocates, and prints the total textures (3).
[defaults]
frame = 45
[state.light]
[state.dark]
[state.dark.env]
THEME_MODE = "dark"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
