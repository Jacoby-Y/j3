# `j3c golden speculative/46_ui_multianim`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 13 of plan 026: several animations per element (spin + pulse, name list with cycling longhands), var() in @keyframes
# (two accents), % in @keyframes (left / width against the containing block, translate against the box).
# `run`: mid-flight (infinite animations). `done`: the same page after every animation finished with fill forwards.
[defaults]
frame = 20
[state.run]
[state.done]
[state.done.env]
MULTI_DONE = "1"
[check.steady]
frames = 200
[check.steady.env]
MULTI_DONE = "1"
J3_STEADY = "60:120"
