# `j3c golden speculative/38_ui_focus`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# :focus-within (card border and tint) and :focus-visible (outline) on buttons and a text box.
#   none   nothing focused
#   key    frame 20: Tab, Tab: the second button has the ring and its card is lit
#   mouse  frame 20: a click on the second button: the card is lit, no ring
#   text   frame 20: a click on the text box: ring even from the mouse
[defaults]
frame = 20
[state.none]
[state.key]
[state.key.env]
FOCUS_MODE = "key"
[state.mouse]
[state.mouse.env]
FOCUS_MODE = "mouse"
[state.text]
[state.text.env]
FOCUS_MODE = "text"
