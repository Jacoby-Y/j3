# `j3c golden speculative/54_ui_stacking`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 22 of plan 026: nested stacking contexts. Eight small demos (see the labels); every "z-index N inside" box stays inside its context.
#   rest    a z-index 9999 box inside a z 1 card is under the z 2 card; negative z above its parent's background; opacity, isolation and
#           transform make contexts; a filter group holds its z-indexed child (gray); a fixed box escapes overflow: hidden; flex order
#   hover   the pointer over the overlap of the z 9999 box and the z 2 card outlines the card: the hit is the painted topmost
[defaults]
frame = 60
[state.rest]
[state.hover]
[state.hover.env]
STACK_MODE = "hover"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
