# `j3c golden speculative/39_ui_prefs`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# `@media (prefers-color-scheme)` / `(prefers-reduced-motion)` answered by Dom.setColorScheme / setReducedMotion.
# A box fades in over 200 ms from frame 6; frame 9 is mid-fade unless motion is reduced.
#   light    default scheme, frame 20
#   dark     dark scheme, frame 20
#   motion   frame 9: the box is half faded in
#   touch    J3_POINTER=coarse: `(pointer: coarse) and (hover: none)` give the title a gold bar
#   reduced  frame 9: reduced motion: the box is already fully shown, the css-only "spin" box is recoloured
[defaults]
frame = 20
[state.light]
[state.dark]
[state.dark.env]
PREFS_MODE = "dark"
[state.touch]
[state.touch.env]
J3_POINTER = "coarse"
[state.motion]
frame = 9
[state.reduced]
frame = 9
[state.reduced.env]
PREFS_MODE = "reduced"
