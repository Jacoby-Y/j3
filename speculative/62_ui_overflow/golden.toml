# `j3c golden speculative/62_ui_overflow`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 36 of plan 026: independent `overflow-x` / `overflow-y`. Each box holds the same oversized child (a frame with a cross):
# hidden (both), x:clip (right cut, below shows), y:clip (below cut, right shows), clip (both), x:hidden alone (y becomes auto: cut, scrollbars off),
# visible (nothing cut), and an x:clip box inside an overflow:hidden box (the outer clip still cuts the y content).
[defaults]
frame = 4
[state.overflow]
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
