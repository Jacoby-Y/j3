# `j3c golden speculative/35_ui_drag`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Item drag and drop: an inventory grid; a testkit drag (frames 6..11) moves "Sword" from slot 0 to the empty slot 5.
#   before    idle grid
#   dragging  frame 10: ghost under the pointer, source dimmed (:dragging), slot 5 lit (:drop-target)
#   dropped   Sword now sits in slot 5
[defaults]
frame = 4
[state.before]
[state.dragging]
frame = 10
[state.dropped]
frame = 16
