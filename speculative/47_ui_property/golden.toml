# `j3c golden speculative/47_ui_property`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 14 of plan 026: `@property` typed custom properties that animate. A progress ring driven by `--p` (a percentage stop in a
# conic-gradient), a gradient spinner driven by `--a` (the `from` angle), a bar whose child reads the inherited `--w`.
# `run`: mid-flight (the spinner never stops). `done`: the same page after every animation finished with fill forwards.
[defaults]
frame = 20
[state.run]
[state.done]
[state.done.env]
PROP_DONE = "1"
[check.steady]
frames = 200
[check.steady.env]
PROP_DONE = "1"
J3_STEADY = "60:120"
