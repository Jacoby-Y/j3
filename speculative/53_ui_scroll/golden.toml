# `j3c golden speculative/53_ui_scroll`. Needs DejaVu Sans (setFallbackFont in src/main.j3).
# Chunk 21 of plan 026: scroll snap, scrollIntoView.
#   rest    carousel at card 1, list at the top
#   wheel   frames 5-9 scroll the carousel by five notches (240 px): it settles on the card start nearest to that (mandatory snap)
#   into    frames 5-8 click "To last", whose handler calls d.scrollIntoView(d.byId("last"), SC_CENTER, true): the list glides to the end
[defaults]
frame = 80
[state.rest]
[state.wheel]
[state.wheel.env]
SCROLL_MODE = "wheel"
[state.into]
[state.into.env]
SCROLL_MODE = "into"
[check.steady]
frames = 200
[check.steady.env]
J3_STEADY = "60:120"
