# `j3c golden speculative/21_ui_select`. Captures drift from the goldens by at most 2 per channel (plan 023 3a), hence tol.
[defaults]
frame = 30
tol = 2
[state.default]
[state.default.env]
SEL_GOLDEN = "default"
[state.themed]
[state.themed.env]
SEL_GOLDEN = "themed"
[state.multi]
[state.multi.env]
SEL_GOLDEN = "multi"
[state.long]
[state.long.env]
SEL_GOLDEN = "long"
[state.custom]
[state.custom.env]
SEL_GOLDEN = "custom"
[check.selects]
