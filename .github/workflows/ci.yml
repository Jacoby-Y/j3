name: CI

on:
  push:
  pull_request:

env:
  J3C_NO_INSTALL: "1"
  CARGO_TERM_COLOR: always
  # Offscreen GL on a runner without a GPU: mesa's software renderer.
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libsdl2-2.0-0 libsdl2-ttf-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libgl1 libgl1-mesa-dri libegl1 libegl-mesa0 \
            libssl3 \
            fonts-dejavu-core fonts-dejavu-mono fonts-noto-color-emoji fonts-noto-cjk \
            fonts-noto-mono fonts-liberation fonts-open-sans

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            j3c/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('j3c/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        working-directory: j3c
        run: cargo test --release --no-fail-fast

      - name: Build j3c
        working-directory: j3c
        run: cargo build --release

      - name: j3c doctor (diagnostic)
        run: j3c/target/release/j3c doctor || true

      - name: Samples and examples
        run: tools/ci/samples.sh

      - name: Stdlib tests
        if: ${{ !cancelled() }}
        run: tools/ci/stdlib-tests.sh
