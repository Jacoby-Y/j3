name: CI

on:
  push:
  pull_request:

env:
  J3C_NO_INSTALL: "1"
  CARGO_TERM_COLOR: always
  # Offscreen GL on a runner without a GPU: mesa's software renderer.
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # stage 0 is built from the tag rust-final

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libsdl2-2.0-0 libsdl2-ttf-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libgl1 libgl1-mesa-dri libegl1 libegl-mesa0 \
            libssl3 \
            fonts-dejavu-core fonts-dejavu-mono fonts-noto-color-emoji fonts-noto-cjk \
            fonts-noto-mono fonts-liberation fonts-open-sans

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            j3c-bootstrap/target/stage0-cargo
          key: ${{ runner.os }}-stage0-${{ hashFiles('j3c-bootstrap/stage0/VERSION') }}

      - name: Build j3c (stage 0 from rust-final, then stage 1 and 2)
        id: build
        run: J3_BIN_DIR=$PWD/target/bin ./build.sh

      - name: Compiler unit tests
        run: j3c-bootstrap/tests/unit.sh

      - name: j3c doctor (diagnostic)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: j3c-bootstrap/target/j3c doctor || true

      - name: Samples and examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/ci/samples.sh

      - name: Stdlib tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/ci/stdlib-tests.sh
