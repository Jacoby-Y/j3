name: CI

on:
  push:
  pull_request:

env:
  J3C_NO_INSTALL: "1"
  CARGO_TERM_COLOR: always
  # Offscreen GL on a runner without a GPU: mesa's software renderer.
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The windows job runs whenever j3c.exe was built, even if a later Linux test step failed.
    outputs:
      exe: ${{ steps.exe.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe (version), and stage 0 is built from the tag rust-final

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libsdl2-2.0-0 libsdl2-ttf-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libgl1 libgl1-mesa-dri libegl1 libegl-mesa0 \
            libssl3 \
            fonts-dejavu-core fonts-dejavu-mono fonts-noto-color-emoji fonts-noto-cjk \
            fonts-noto-mono fonts-liberation fonts-open-sans \
            mingw-w64 binutils-mingw-w64-x86-64 zip

      # The runner has no j3c and no J3 release is pinned yet (j3c-bootstrap/seed/VERSION says `unset`), so the
      # seed is stage 0: the Rust j3c at the tag rust-final, built by tools/stage0.sh into ~/.cache/j3/stage0
      # (cached here; stage0.sh reuses a binary built from the same commit). Once a release is pinned, drop this
      # cache and the J3_SEED line: build.sh fetches the pinned seed itself (tools/seed.sh).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/j3/stage0
          key: ${{ runner.os }}-stage0-rust-final-v1

      - name: Build j3c (seed = stage 0 from rust-final, then stage 1 and 2)
        id: build
        run: |
          seed=$(j3c-bootstrap/tools/stage0.sh rust-final)
          J3_SEED=$seed ./build.sh

      # tests/unit.sh (120 programs, about 3.5 min on 2 jobs locally) is not run here yet.
      - name: Compiler tests (tests/cases)
        run: j3c-bootstrap/target/j3c test-compiler

      - name: j3c doctor (diagnostic)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: j3c-bootstrap/target/j3c doctor || true

      - name: Samples and examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/ci/samples.sh

      - name: Stdlib tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/ci/stdlib-tests.sh

      # j3c.exe, cross-built by the j3c just built, zipped as a release would be; the windows job installs it.
      - name: Build j3c.exe (cross)
        id: exe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: J3_SKIP_BUILD=1 tools/release/package.sh --windows

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.exe.outcome == 'success' }}
        with:
          name: j3c-windows
          path: |
            dist/j3c-*-x86_64-windows.zip
            dist/SHA256SUMS

  # j3c on a Windows host (plan 08 chunk 8): install the zip like a user, build and run console and SDL programs,
  # then let j3c.exe build itself (tools/ci/windows-smoke.ps1).
  windows:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.exe == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # LF checkouts: CRLF sources would change the embedded docs id the self-build check compares.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe: the self-build embeds the same version as the zip

      - uses: actions/download-artifact@v4
        with:
          name: j3c-windows
          path: artifact

      # Pin the cache root: j3c prefers HOME/.cache/j3 when HOME is set, which would miss the cache below.
      - name: J3_CACHE
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "J3_CACHE=$env:LOCALAPPDATA\j3"

      # What `j3c setup` downloads (about 530 MB llvm-mingw + 80 MB SDL kits), keyed on its pin table.
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\j3\toolchain
            ~\AppData\Local\j3\sdl2-mingw
          key: windows-j3-setup-${{ hashFiles('j3c-bootstrap/src/toolchain/setup.j3') }}

      - name: Smoke test
        shell: pwsh
        run: tools/ci/windows-smoke.ps1 -ZipDir artifact
