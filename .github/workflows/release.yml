name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # 22.04 keeps the glibc floor at 2.35 (see packaging/README.md).
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' j3c/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match j3c/Cargo.toml version $v"
            exit 1
          fi

      - name: Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Package
        run: |
          tools/release/package.sh
          mv dist/SHA256SUMS "dist/SHA256SUMS.$(uname -m)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS.* > dist/SHA256SUMS
          rm dist/SHA256SUMS.*
          v=${GITHUB_REF_NAME#v}
          # This release's CHANGELOG section as the notes.
          awk -v h="## [$v]" 'index($0, h) == 1 { p = 1; next } /^## \[/ { p = 0 } p' CHANGELOG.md > notes.md
          # Drafts: publish by hand after a look (install.sh only sees published releases).
          # `gh release view <tag>` misses drafts, so look the tag up in the list (drafts included).
          gh release list --json tagName --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME" ||
            gh release create "$GITHUB_REF_NAME" --draft --title "j3c $v" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
