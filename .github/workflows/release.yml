name: Release

on:
  push:
    branches: [main]  # every push to main cuts the next patch release
    tags: ["v*"]      # or push a tag by hand for a minor/major bump

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag push releases that tag. A main push tags HEAD with the next patch (unless HEAD is already tagged).
      # Tags pushed with GITHUB_TOKEN don't trigger workflows, so this run doesn't fire twice.
      - id: t
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then t=$GITHUB_REF_NAME
          elif t=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null); then :
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            IFS=. read -r ma mi pa <<<"${last#v}"
            t="v$ma.$mi.$((pa + 1))"
            git tag "$t" && git push origin "$t"
          fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        # 22.04 keeps the glibc floor at 2.35 (see packaging/README.md).
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe (version), and stage 0 is built from the tag rust-final
          ref: ${{ needs.tag.outputs.tag }}

      # No J3 release is pinned yet (j3c-bootstrap/seed/VERSION says `unset`) and the runner has no j3c, so the
      # seed is stage 0: the Rust j3c at the tag rust-final, built with cargo by tools/stage0.sh (prints its
      # path). Once a release is pinned, drop these two steps: package.sh fetches the pinned seed (tools/seed.sh).
      - name: Rust (stage 0 only)
        run: |
          if ! command -v cargo >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Seed (stage 0)
        run: |
          seed=$(j3c-bootstrap/tools/stage0.sh rust-final)
          echo "J3_SEED=$seed" >> "$GITHUB_ENV"

      # j3c.exe is cross-built here, by the Linux j3c just built (plan 08 decision 10): clang targets mingw,
      # windres puts the manifest and icon in (package.sh fails without it).
      - name: Windows cross tools
        if: runner.arch == 'X64'
        run: sudo apt-get update && sudo apt-get install -y clang mingw-w64 binutils-mingw-w64-x86-64 zip

      - name: Package
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          tools/release/package.sh
          v=$(j3c-bootstrap/target/j3c version | awk '{print $2}')
          [ "$TAG" = "v$v" ] || { echo "::error::binary says $v, tag is $TAG"; exit 1; }
          if [ "$(uname -m)" = x86_64 ]; then
            J3_SKIP_BUILD=1 tools/release/package.sh --windows
            cp install.ps1 dist/
          fi
          mv dist/SHA256SUMS "dist/SHA256SUMS.$(uname -m)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: dist/

  release:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          cat dist/SHA256SUMS.* > dist/SHA256SUMS
          rm dist/SHA256SUMS.*
          v=${TAG#v}
          # This release's CHANGELOG section as the notes, else GitHub's generated commit list.
          awk -v h="## [$v]" 'index($0, h) == 1 { p = 1; next } /^## \[/ { p = 0 } p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release list --json tagName --jq '.[].tagName' | grep -qx "$TAG" ||
            gh release create "$TAG" --title "j3c $v" "${notes[@]}"
          gh release upload "$TAG" dist/* --clobber
