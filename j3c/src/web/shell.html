<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J3</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 10px; font: 13px monospace;
            color: #ddd; background: rgba(0, 0, 0, .7); white-space: pre-wrap; }
  #status:empty { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">loading…</div>
<script>
// J3 web shell (plan 06). Under `j3c -e web run` the dev server answers /__j3/*: env vars go into ENV,
// output streams to the terminal, written screenshot files are uploaded, and the exit code is reported.
// On a static host /__j3/env is missing, so none of that happens.
(function () {
  var status = document.getElementById('status');
  var dev = null;          // the env JSON, or null off the dev server
  var chain = Promise.resolve();
  var pending = { 1: '', 2: '' };
  var errTail = [];
  function post(url, body) {
    if (!dev) return;
    chain = chain.then(function () { return fetch(url, { method: 'POST', body: body }); }).catch(function () {});
  }
  function out(fd, text) {
    if (fd === 2) { errTail.push(text); if (errTail.length > 20) errTail.shift(); }
    (fd === 2 ? console.error : console.log)(text);
    pending[fd] += text + '\n';
    if (pending[fd].length > 4096) flush();
  }
  function flush() {
    for (var fd in pending) { if (pending[fd]) { post('/__j3/log?fd=' + fd, pending[fd]); pending[fd] = ''; } }
  }
  setInterval(flush, 50);
  function upload(path) {
    if (!path) return;
    path = path.split(':')[0];
    try {
      var bytes = Module.FS.readFile(path);
      post('/__j3/file?name=' + encodeURIComponent(path.split('/').pop()), bytes);
    } catch (e) { out(2, 'j3 shell: no file ' + path + ' to upload'); }
  }
  var finished = false;
  function finish(code) {
    if (finished) return;
    finished = true;
    flush();
    if (dev) { upload(dev.env.J3_SCREENSHOT); upload(dev.env.J3_CAPTURE); }
    post('/__j3/exit?code=' + code, '');
    if (code !== 0) status.textContent = 'exited with ' + code + '\n' + errTail.join('\n');
  }
  window.Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { out(1, t); },
    printErr: function (t) { out(2, t); },
    setStatus: function (t) { status.textContent = t; },
    // Wait for the env before `main`, so it sees J3_FRAMES and friends. Needs the link to export
    // ENV, FS, addRunDependency and removeRunDependency (EXPORTED_RUNTIME_METHODS, plan 06 chunk 2).
    preRun: [function () {
      Module.addRunDependency('j3env');
      fetch('/__j3/env').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
        .then(function (j) { dev = j && j.dev ? j : null; if (dev) for (var k in dev.env) Module.ENV[k] = dev.env[k]; })
        .finally(function () { Module.removeRunDependency('j3env'); });
    }],
    onExit: function (code) { finish(code); },
    // a trap or failed assertion: a native crash would be a signal (SIGABRT, 128 + 6)
    onAbort: function (why) { out(2, 'aborted: ' + why); finish(134); },
  };
  window.addEventListener('error', function (e) { out(2, String(e.message)); });
})();
</script>

</body>
</html>
