[package]
name = "j3c"
version = "0.0.1"
edition = "2021"
description = "J3 compiler — parse, typed IR, emit LLVM or C"
publish = false

[lib]
name = "j3c"
path = "src/lib.rs"

[[bin]]
name = "j3c"
path = "src/main.rs"

# No crates.io deps. Clap/LLVM/serde would dominate /target.

[profile.dev]
debug = 0
incremental = false
opt-level = 0
split-debuginfo = "off"
strip = "none"
debug-assertions = true
overflow-checks = true

[profile.dev.build-override]
debug = 0
incremental = false
opt-level = 0

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
incremental = false
opt-level = 0
split-debuginfo = "off"

[profile.release]
debug = 0
incremental = false
strip = true
lto = false
codegen-units = 1
panic = "abort"
