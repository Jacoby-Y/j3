[package]
name = "j3c"
version = "0.1.0"
edition = "2021"
description = "J3 compiler — parse, typed IR, emit LLVM or C"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jacoby-Y/j3"

[lib]
name = "j3c"
path = "src/lib.rs"

[[bin]]
name = "j3c"
path = "src/main.rs"

# No crates.io deps. Profiles tuned for build speed, not /target size.

[profile.dev]
debug = 0
incremental = true
opt-level = 0
split-debuginfo = "off"
strip = "none"
debug-assertions = true
overflow-checks = true

[profile.dev.build-override]
debug = 0
opt-level = 0

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
incremental = true
opt-level = 0
split-debuginfo = "off"

[profile.release]
debug = 0
incremental = true
strip = true
lto = false
codegen-units = 16
panic = "abort"
