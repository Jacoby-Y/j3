<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>j3ui Feature Support</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1d1d1f; --muted: #6b6b72; --line: #e4e4e0; --hover: #efefeb;
  --y: #1f8a4c; --y-bg: #e3f4ea; --p: #a86a00; --p-bg: #fbf0d9; --n: #c0392b; --n-bg: #fbe5e2; --x: #5b4bc4; --x-bg: #ebe8fb;
  --code: #f0f0ec; --accent: #5b4bc4;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121216; --panel: #1a1a20; --fg: #e8e8ee; --muted: #8c8c99; --line: #2a2a33; --hover: #22222a;
  --y: #4cc97f; --y-bg: #16301f; --p: #e3a63a; --p-bg: #33270f; --n: #f0776a; --n-bg: #3a1a17; --x: #a99cf5; --x-bg: #25213f;
  --code: #24242c; --accent: #a99cf5;
} }
:root[data-theme="dark"] {
  --bg: #121216; --panel: #1a1a20; --fg: #e8e8ee; --muted: #8c8c99; --line: #2a2a33; --hover: #22222a;
  --y: #4cc97f; --y-bg: #16301f; --p: #e3a63a; --p-bg: #33270f; --n: #f0776a; --n-bg: #3a1a17; --x: #a99cf5; --x-bg: #25213f;
  --code: #24242c; --accent: #a99cf5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
code { font: 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; }
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 20px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav h1 { font-size: 15px; padding: 0 10px 2px; }
nav .sub { font-size: 12px; color: var(--muted); padding: 0 10px 14px; }
nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 10px 4px; }
nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; color: inherit; text-decoration: none; }
nav a:hover { background: var(--hover); }
nav a.on { background: var(--x-bg); color: var(--accent); font-weight: 600; }
.dots { display: flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
main { padding: 36px 44px 60px; max-width: 980px; }
main h2 { font-size: 24px; margin-bottom: 4px; }
main .lead { color: var(--muted); margin-bottom: 18px; max-width: 70ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td:first-child { width: 34%; }
td:nth-child(2) { width: 120px; white-space: nowrap; }
td:last-child { color: var(--muted); }
.b { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.y { color: var(--y); background: var(--y-bg); } .p { color: var(--p); background: var(--p-bg); }
.n { color: var(--n); background: var(--n-bg); } .x { color: var(--x); background: var(--x-bg); }
i.y { background: var(--y); } i.p { background: var(--p); } i.n { background: var(--n); } i.x { background: var(--x); }
.foot { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
#menu { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 6px; }
  nav .links { display: none; } nav.open .links { display: block; }
  #menu { display: block; margin: 0 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--hover); color: inherit; font: inherit; }
  main { padding: 22px 16px 40px; }
  td:first-child { width: auto; }
  td:last-child { font-size: 13px; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <h1>.j3ui feature support</h1>
    <div class="sub">HTML &amp; CSS vs the browser · from <code>j3c doc css</code> / <code>j3c doc j3ui</code></div>
    <button id="menu">Sections ▾</button>
    <div class="links" id="links"></div>
  </nav>
  <main id="main"></main>
</div>
