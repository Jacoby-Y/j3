# Voxel editor. From the repo root:
#   j3c build tools/voxel-editor      then      tools/voxel-editor/vox        (window)
#   tools/voxel-editor/vox run models/robot.j3voxel "box 0 0 0 7 7 7 red" --render robot.png
# Needs SDL2 + libGL (the window, and the hidden window that renders PNGs for agents).

[package]
name = "voxel_editor"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 1
debug = false

[link]
libs = ["SDL2", "GL"]
