# 2D draw baseline. From the repo root:
#   j3c build --release tools/bench2d && (cd tools/bench2d && timeout 60 target/bench2d rects 1000)
# Scenes: ui N (N BallCards through j3.ui.dom) | rects N | text N | mixed | paint-rects N | paint-text N | paint-mixed | shapes (golden page).
# Optional 3rd arg: run that many frames. Golden: golden/shapes.png (see the shapes scene in src/main.j3).
# Run headless: SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy timeout 10 target/bench2d mixed

[package]
name = "bench2d"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 0

[link]
libs = ["SDL2", "SDL2_ttf", "SDL2_image"]
