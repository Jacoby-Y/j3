# Composer: a small DAW with a built-in synth. From the repo root:
#   tools/composer/composer songs/demo.j3song                       (window)
#   tools/composer/composer run songs/demo.j3song "help" --wav d.wav (headless, for agents)
# Needs SDL2 + libGL for the window and PNG renders; `run --wav` needs nothing.

[package]
name = "composer"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 2
debug = false

[link]
libs = ["SDL2", "GL"]
