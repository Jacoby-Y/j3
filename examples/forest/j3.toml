# Asset-aware forest with shadowed volumetric sunlight and glass/metal spheres.
[package]
name = "forest"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 2

[link]
libs = ["SDL2", "SDL2_image", "SDL2_ttf", "GL"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
