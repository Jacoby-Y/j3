[package]
name = "j2_arena"
entry = "src/main.j3"
version = "0.1.0"
description = "Top-down arena whose enemies, weapons, waves, and HUD are j2 scripts"

[emit]
backend = "llvm"
opt = 1
debug = true

[link]
libs = ["SDL2", "SDL2_ttf"]

[dist]
# Scripts ship as plain text next to the binary. Players add a folder to j2-scripts/; the game
# reloads scripts when any main.j2 is saved, so no restart either.
include = ["j2-scripts"]
# build_outputs = ["zip"]
