# `j3c golden examples/j2_script`: one frame of the self-playing run (fixed seed, fake input),
# then the ARENA_TEST self-test (it exits 0 on pass; it touches j2-scripts/hello/main.j2's mtime).
[defaults]
frame = 300
[state.arena]
[state.arena.env]
ARENA_TEST = "1"
[check.arena-test]
timeout = 120
[check.arena-test.env]
ARENA_TEST = "1"
