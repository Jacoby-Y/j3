# `j3c golden examples/big_ui_test`: the post-effect pages (filter groups bounded to their drawn area must look the
# same as full-surface ones), then the idle-cost check on the small-glow page (dynamic ancestor class + filter).
[defaults]
frame = 40
# bounded groups normalise the crt warp to a smaller target: a few pixels round one level apart
tol = 1
[state.small-glows]
[state.small-glows.env]
UI_PAGE = "13"
UI_POST_TAB = "3"
[state.filters]
[state.filters.env]
UI_PAGE = "13"
UI_POST_TAB = "1"
[state.filters-combined]
[state.filters-combined.env]
UI_PAGE = "13"
UI_POST_TAB = "1"
UI_POST_FX = "5"
UI_POST_BLEND = "overlay"
[state.glass]
[state.glass.env]
UI_PAGE = "13"
UI_POST_TAB = "0"
[state.shader]
[state.shader.env]
UI_PAGE = "13"
UI_POST_TAB = "2"
[check.steady]
frames = 200
[check.steady.env]
UI_PAGE = "13"
UI_POST_TAB = "3"
J3_STEADY = "60:120"
