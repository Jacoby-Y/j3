[package]
name = "todo-dioxus"
version = "0.1.0"
edition = "2021"

[dependencies]
# "native" renders HTML/CSS itself (Blitz: Stylo + Taffy + Vello), no webview
dioxus = { version = "0.7", features = ["native"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
