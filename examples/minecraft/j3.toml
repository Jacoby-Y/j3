# Small block world. From the repo:
#   j3c run examples/minecraft
# Needs SDL2 + OpenGL 3.3 (libGL).
# Mouse look, WASD, space jump, left break, right place, 1-7 pick a block.
# Esc frees the cursor. F3 toggles corner shadows. Q quits.

[package]
name = "minecraft"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

[emit]
backend = llvm
opt = 0
debug = true

[link]
libs = ["SDL2", "GL"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
