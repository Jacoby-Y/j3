# Textured block valley and URP material demo. From the repo:
#   j3c run examples/minecraft
# Needs SDL2 + image/ttf + OpenGL 3.3 (libGL).
# Mouse look, WASD, space jump, left break, right place, 1-9 or wheel to select.
# Esc opens settings. F3 toggles corner shadows. Q quits.

[package]
name = "minecraft"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

[emit]
backend = llvm
opt = 0
debug = true

[link]
libs = ["SDL2", "SDL2_image", "SDL2_ttf", "GL"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
