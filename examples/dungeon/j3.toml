# Modest dungeon crawler. From the repo:
#   j3c run examples/dungeon
# PNG/WAV/TTF live in assets/. If SDL2_image/mixer/ttf are not
# installed, ./lib is linked (and rpath'd) as a fallback.

[package]
name = "dungeon"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

[emit]
backend = llvm
opt = 0
debug = true

[link]
libs = ["SDL2", "SDL2_image", "SDL2_mixer", "SDL2_ttf"]
search = ["lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib"]
