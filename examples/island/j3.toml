# Voxel island. From the repo:
#   j3c run examples/island
# Needs SDL2 + OpenGL 3.3 (libGL). Drag to orbit, wheel to zoom, R resets, Esc quits.

[package]
name = "island"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

[emit]
backend = llvm
opt = 0
debug = true

[link]
# `use lib "SDL2"` / `use lib "GL"` already emit -l flags.
libs = ["SDL2", "GL"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
