# Example game project. From the repo:
#   j3c run examples/bounce
#   j3c build examples/bounce
# From this directory: `j3c run` / `j3c build`.

[package]
name = "bounce"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

# Printer + clang/cc. LLVM is default; set backend = c to keep the C path.
# opt: 0 compile speed, 2 runtime (used if [emit] is present and opt is omitted).
# debug / fast / target / cpu / clang / flags can be added here too.
[emit]
backend = llvm
opt = 0
debug = true

[link]
# `use lib "SDL2"` in j3.game already emits -lSDL2.
# Extra -l / -L / objects / raw cc flags go here.
libs = ["SDL2", "SDL2_image", "SDL2_mixer", "SDL2_ttf"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
