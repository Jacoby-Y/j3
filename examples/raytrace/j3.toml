# Interactive URP raytracing demo: H toggles settings, drag orbits, wheel zooms.
[package]
name = "raytrace"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 2

[link]
libs = ["SDL2", "SDL2_ttf", "GL"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
