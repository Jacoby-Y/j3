# Leaf cleaning. From the repo:
#   j3c run examples/leaves
# Needs SDL2 + image/mixer/ttf and OpenGL 3.3.
# First person. Mouse looks, WASD walks, space jumps, click grabs a leaf.
# E opens the shop (mouse frees). Esc frees the mouse, then quits.
# R starts over. Enter starts over after the yard is clear. Q quits.

[package]
name = "leaves"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

[emit]
backend = llvm
opt = 0
debug = true

[link]
libs = ["SDL2", "SDL2_image", "SDL2_mixer", "SDL2_ttf", "GL"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
