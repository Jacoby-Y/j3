# `j3c golden examples/desk-app`: five UI states (image + accessibility tree), then the idle-cost and fake-input checks.
[defaults]
frame = 30
[state.browser]
text = "target/ui-a11y.txt"
[state.browser.env]
DESK_GOLDEN = "browser"
DESK_SNAPSHOT = "30"
[state.filter]
text = "target/ui-a11y.txt"
[state.filter.env]
DESK_GOLDEN = "filter"
DESK_SNAPSHOT = "30"
[state.rename]
text = "target/ui-a11y.txt"
[state.rename.env]
DESK_GOLDEN = "rename"
DESK_SNAPSHOT = "30"
[state.settings]
text = "target/ui-a11y.txt"
[state.settings.env]
DESK_GOLDEN = "settings"
DESK_SNAPSHOT = "30"
[state.toast]
text = "target/ui-a11y.txt"
[state.toast.env]
DESK_GOLDEN = "toast"
DESK_SNAPSHOT = "30"
[check.steady]
frames = 200
[check.steady.env]
DESK_GOLDEN = "browser"
J3_STEADY = "60:120"
[check.ui-test]
[check.ui-test.env]
DESK_PREFS = "target/test.save"
DESK_TEST = "1"
