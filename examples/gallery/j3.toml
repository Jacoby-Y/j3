# UI gallery. From the repo:
#   j3c run examples/gallery
#   j3c check examples/gallery

[package]
name = "gallery"
entry = "src/main.j3"

[cc]
std = "c11"
opt = "0"

[emit]
backend = llvm
opt = 0
debug = true

[link]
libs = ["SDL2", "SDL2_image", "SDL2_mixer", "SDL2_ttf"]
search = ["../dungeon/lib"]
files = []
flags = ["-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../dungeon/lib"]
