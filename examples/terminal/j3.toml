# A simple terminal emulator: your shell on a pty, drawn with j3.term.view. Linux. Needs SDL2, SDL_ttf, libGL.
# j3c run examples/terminal       (TERM_CMD="ls --color=always" runs that instead of $SHELL and keeps the screen)

[package]
name = "terminal"
entry = "src/main.j3"
version = "0.1.0"

[emit]
backend = "llvm"
opt = 1
debug = true

[link]
libs = ["SDL2", "SDL2_ttf", "GL"]
