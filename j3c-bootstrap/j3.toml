# j3c written in J3. Stubs only for now: see README.md and plans/boostrap_features.md.

[package]
name = "j3c"
# Never `j3c` until it replaces the Rust one (plan 11 A3); build.sh refuses to install it.
bin = "j3c-boot"
version = "0.0.1"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 0
debug = true

# No [dependencies]: the scene tools run the editor program in its `cli` mode (as Rust does) since plan 13 wave 2;
# B12.1's in-process `j3_editor.tool` linked libSDL2 into j3c-boot.
