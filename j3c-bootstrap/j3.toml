# j3c written in J3. Stubs only for now: see README.md and plans/boostrap_features.md.

[package]
name = "j3c"
# Never `j3c` until it replaces the Rust one (plan 11 A3); build.sh refuses to install it.
bin = "j3c-boot"
version = "0.0.1"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 0
debug = true

[dependencies]
# The scene tools run the editor's own `tool.j3` in-process (plan 11 B12.1, `scene/ops.j3`). The folder is the
# module root (no j3.toml there): `use j3_editor.tool`. Only `tools` files may use it (tools/layers.sh).
j3_editor = { path = "../j3c/editor/src" }
