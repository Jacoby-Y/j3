# j3c, the J3 compiler, written in J3 (README.md). Since plan 11 C6 it is the installed `j3c`.

[package]
name = "j3c"
bin = "j3c"
version = "0.0.1"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 0
debug = true

# No [dependencies]: the scene tools run the editor program in its `cli` mode (as Rust does) since plan 07 wave 2;
# B12.1's in-process `j3_editor.tool` linked libSDL2 into j3c.
