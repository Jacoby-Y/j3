# j3c written in J3. Stubs only for now: see README.md and plans/boostrap_features.md.

[package]
name = "j3c"
# Never `j3c` until it replaces the Rust one (plan 11 A3); build.sh refuses to install it.
bin = "j3c-boot"
version = "0.0.1"
entry = "src/main.j3"

[emit]
backend = llvm
opt = 0
debug = true
