# DIST fixture (wave 26): `build --release` writes a zip and a .deb (Rust cli/tests.rs `dist_output_runs`,
# dist.rs, deb.rs). The default include dirs (`assets`, `scenes`), title-cased menu name, actions, depends,
# postinst, the J3 logo as icon. tests/tool/dist.txt compares the unpacked archives.
[package]
name = "dist_game"
version = "1.2.3"
description = "A tiny game\nsecond line is dropped"

[dist]
build_outputs = ["zip", "deb"]
maintainer = "Test Person <test@example.com>"
depends = ["libfoo1"]
postinst = "pkg/postinst"

[dist.actions]
new = { name = "New Island", exec = "--new-island" }
plain = { name = "Plain" }
