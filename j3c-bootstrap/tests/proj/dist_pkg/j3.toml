# DIST fixture (wave 26, tests/tool/dist.txt `pkg`): package outputs (Rust cli/tests.rs `dist_output_runs`). The
# tool package sits inside the game, so the tool cache (`J3_PKG_DIR=pkgcache`, relative) resolves the same from
# j3c and from the tool, whose cwd is the project root.
[package]
name = "dist_pkg"

[dependencies]
tool_dist = "tool_dist"

[dist]
build_outputs = ["zip", "fake", "notdir"]
include = ["data.txt"]
