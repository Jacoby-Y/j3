# Package commands case (Rust cli/tests.rs `pkg_tool_runs_and_caches`): a game with a path dependency on the tool
# package beside its src (`tool_pkg/`, the Rust fixture `tests/programs/tool_pkg`), which has one command and one
# dist output. `pkg`, `pkg NAME`, `add --path`, `fetch` run on scratch copies with `J3_PKG_DIR` in scratch.
[package]
name = "tool_pkg_game"

[dependencies]
tool_pkg = "tool_pkg"

[tool_pkg]
greeting = "hi from the game"
